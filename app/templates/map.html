{% extends "base.html" %}

{% block og_description %}Places I've visited.{% endblock %}

{% block content %}
<section class="section">
    <div class="section-head">
        <span class="section-num">01</span>
        <h2 class="section-label">Places I've Visited</h2>
    </div>
    <div class="map-wrap">
        <img src="{{ url_for('static', filename='img/world-map.jpg') }}" alt="World map"
             width="2058" height="1036" decoding="async">
        {% for place in places %}
        <span class="map-pin" style="left: {{ place.left }}%; top: {{ place.top }}%;"
              tabindex="0" title="{{ place.name }}">
            <span class="map-label">{{ place.name }}</span>
        </span>
        {% endfor %}
    </div>
    <p class="map-legend">{{ places | length }} locations &middot; equirectangular projection</p>
</section>
{% endblock %}
