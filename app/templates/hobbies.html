{% extends "base.html" %}

{% block og_description %}Things I do when I'm not shipping.{% endblock %}

{% block content %}
<section class="section">
    <div class="section-head">
        <span class="section-num">01</span>
        <h2 class="section-label">Hobbies</h2>
    </div>
    <div class="hobby-grid">
        {% for hobby in hobbies %}
        <div class="hobby-card">
            <div class="hobby-media">
                <img src="{{ url_for('static', filename='img/' ~ hobby.image) }}"
                     alt="{{ hobby.name }}" loading="lazy" decoding="async">
            </div>
            <h3 class="hobby-name">{{ hobby.name }}</h3>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
