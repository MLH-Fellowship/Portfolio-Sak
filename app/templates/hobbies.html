<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta property="og:title" content="Hobbies">
    <meta property="og:description" content="My Hobbies">
    <meta property="og:url" content="{{ url }}">

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">

    <link lang='sass' rel="stylesheet" href="./static/styles/main.css">
    <link rel='icon' href='./static/img/favicon.ico' type='image/x-icon' />
    <title>{{ title }}</title>
</head>

<body>
    <header class="nav-bar">
        <div class="nav-content">
            <a href="/">
                <div class="nav-logo">
                    <img src="./static/img/logo.svg" />
                </div>
            </a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/hobbies">Hobbies</a>
            </nav>
        </div>
    </header>

    <section class="hobbies">
        <h2>Hobbies</h2>
        <div class="hobby-grid">
            <div class="hobby-card">
                <img src="./static/img/Rubiks_Cube.jpg" alt="Rubik's Cube">
                <h3>Rubik's Cube</h3>
            </div>
            <div class="hobby-card">
                <img src="./static/img/running.png" alt="Running">
                <h3>Running</h3>
            </div>
            <div class="hobby-card">
                <img src="./static/img/hollywood_hike1.jpg" alt="Hiking">
                <h3>Hiking</h3>
            </div>
        </div>
    </section>
</body>

</html>
