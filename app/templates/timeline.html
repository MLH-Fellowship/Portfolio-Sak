<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta property="og:title" content="Timeline">
    <meta property="og:description" content="My Timeline">
    <meta property="og:url" content="{{ url }}">

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">

    <link lang='sass' rel="stylesheet" href="./static/styles/main.css">
    <link rel='icon' href='./static/img/favicon.ico' type='image/x-icon' />
    <title>{{ title }}</title>

    <style>
        .timeline {
            max-width: 640px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem;
        }

        .timeline-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .timeline-form input,
        .timeline-form textarea {
            font-family: inherit;
            font-size: 1rem;
            padding: 0.6rem 0.8rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
        }

        .timeline-form button {
            align-self: flex-start;
            font-family: inherit;
            font-size: 1rem;
            padding: 0.6rem 1.4rem;
            border: none;
            border-radius: 6px;
            background: #2d2d2d;
            color: #fff;
            cursor: pointer;
        }

        .timeline-form button:hover {
            background: #444;
        }

        .timeline-post {
            display: flex;
            gap: 0.9rem;
            padding: 1rem 0;
            border-bottom: 1px solid #e5e5e5;
        }

        .timeline-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .timeline-body {
            flex: 1;
        }

        .timeline-meta {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #777;
        }

        .timeline-name {
            font-weight: 700;
            color: #222;
        }

        .timeline-content {
            margin: 0.25rem 0 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .timeline-empty {
            color: #777;
        }
    </style>
</head>

<body>
    <header class="nav-bar">
        <div class="nav-content">
            <a href="/">
                <div class="nav-logo">
                    <img src="./static/img/logo.svg" />
                </div>
            </a>
            <nav class="nav-links">
                {% for page in pages %}
                <a href="{{ page.url }}">{{ page.name }}</a>
                {% endfor %}
            </nav>
        </div>
    </header>

    <section class="timeline">
        <h2>Timeline</h2>

        <form id="timeline-form" class="timeline-form">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="content" rows="3" placeholder="What's on your mind?" required></textarea>
            <button type="submit">Post</button>
        </form>

        <div id="timeline-list"></div>
    </section>

    <script>
        // Minimal MD5 implementation (public domain) used only for Gravatar hashes.
        function md5(str) {
            function rotl(n, c) { return (n << c) | (n >>> (32 - c)); }
            function toHex(n) {
                let s = '';
                for (let i = 0; i < 4; i++) {
                    s += ((n >> (i * 8)) & 0xff).toString(16).padStart(2, '0');
                }
                return s;
            }

            const K = [];
            for (let i = 0; i < 64; i++) {
                K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296);
            }
            const S = [
                7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
                5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
                4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
                6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21
            ];

            const utf8 = unescape(encodeURIComponent(str));
            const bytes = [];
            for (let i = 0; i < utf8.length; i++) bytes.push(utf8.charCodeAt(i));

            const bitLen = bytes.length * 8;
            bytes.push(0x80);
            while (bytes.length % 64 !== 56) bytes.push(0);
            for (let i = 0; i < 8; i++) bytes.push((bitLen / Math.pow(2, i * 8)) & 0xff);

            let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;

            for (let chunk = 0; chunk < bytes.length; chunk += 64) {
                const M = [];
                for (let i = 0; i < 16; i++) {
                    M[i] = bytes[chunk + i * 4] |
                        (bytes[chunk + i * 4 + 1] << 8) |
                        (bytes[chunk + i * 4 + 2] << 16) |
                        (bytes[chunk + i * 4 + 3] << 24);
                }

                let [A, B, C, D] = [a0, b0, c0, d0];

                for (let i = 0; i < 64; i++) {
                    let F, g;
                    if (i < 16) { F = (B & C) | (~B & D); g = i; }
                    else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
                    else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
                    else { F = C ^ (B | ~D); g = (7 * i) % 16; }

                    F = (F + A + K[i] + M[g]) | 0;
                    A = D; D = C; C = B;
                    B = (B + rotl(F, S[i])) | 0;
                }

                a0 = (a0 + A) | 0;
                b0 = (b0 + B) | 0;
                c0 = (c0 + C) | 0;
                d0 = (d0 + D) | 0;
            }

            return toHex(a0) + toHex(b0) + toHex(c0) + toHex(d0);
        }

        function gravatarUrl(email) {
            const hash = md5(email.trim().toLowerCase());
            return `https://www.gravatar.com/avatar/${hash}?d=identicon&s=96`;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function postElement(post) {
            const el = document.createElement('div');
            el.className = 'timeline-post';
            const date = new Date(post.created_at).toLocaleString();
            el.innerHTML = `
                <img class="timeline-avatar" src="${gravatarUrl(post.email)}" alt="${escapeHtml(post.name)}">
                <div class="timeline-body">
                    <div class="timeline-meta">
                        <span class="timeline-name">${escapeHtml(post.name)}</span>
                        <span class="timeline-date">${date}</span>
                    </div>
                    <p class="timeline-content">${escapeHtml(post.content)}</p>
                </div>
            `;
            return el;
        }

        function renderPosts(posts) {
            const list = document.getElementById('timeline-list');
            list.innerHTML = '';
            if (posts.length === 0) {
                list.innerHTML = '<p class="timeline-empty">No posts yet. Be the first!</p>';
                return;
            }
            posts.forEach(post => list.appendChild(postElement(post)));
        }

        async function loadPosts() {
            const res = await fetch('/api/timeline_post');
            const data = await res.json();
            renderPosts(data.timeline_posts);
        }

        document.getElementById('timeline-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);

            const res = await fetch('/api/timeline_post', {
                method: 'POST',
                body: formData,
            });

            if (res.ok) {
                form.reset();
                loadPosts();
            }
        });

        loadPosts();
    </script>
</body>

</html>
